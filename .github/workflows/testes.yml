
name: Testes Automatizados

on:
  push:
    branches: [principal]
  pull_request:
    branches: [principal]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar testes
        run: node --experimental-test-coverage --test reservas.test.js
